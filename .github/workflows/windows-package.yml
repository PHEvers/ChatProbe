name: Pacote Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build-windows.ps1'
      - '.github/workflows/windows-package.yml'
      - 'app/**'
      - 'src/**'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Build portátil
        run: ./build-windows.ps1
      - name: Verificar ZIP e inicialização
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/ChatProbe-*.zip | Select-Object -First 1
          if (-not $zip) { throw "ZIP não encontrado" }
          $extracted = Join-Path $env:RUNNER_TEMP "chatprobe-extracted"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extracted
          $exe = Join-Path $extracted "ChatProbe/ChatProbe.exe"
          $version = (Get-Content VERSION -Raw).Trim()
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $version) { throw "Versão inconsistente" }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "chatprobe-smoke-data"
          $app = Start-Process -FilePath $exe -PassThru
          try {
            if (-not $app.WaitForInputIdle(15000) -or $app.HasExited) { throw "Falha ao abrir ChatProbe" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: chatprobe-windows
          path: dist/ChatProbe-*.zip
          if-no-files-found: error
